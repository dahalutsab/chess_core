spring:
  profiles:
    active: local

  jpa:
    properties:
      hibernate:
        # Load lazy players and move lists for several games in one query rather than one query each
        default_batch_fetch_size: 32

  # Outgoing email (verification codes, password resets). Credentials come from the environment and are never
  # committed; without them the app runs, but emails fail to send.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:no-reply@uchess.com}
  # Origins allowed to call the API from a browser, comma-separated; "*" allows any (development only)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # The administrator account created on first start; skipped when no password is configured
  admin:
    email: ${ADMIN_EMAIL:admin@uchess.com}
    name: ${ADMIN_NAME:Utsab Dahal}
    password: ${ADMIN_PASSWORD:}
